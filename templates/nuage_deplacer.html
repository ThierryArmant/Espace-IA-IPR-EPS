{% extends "base.html" %}
{% block title %}Déplacer un document · IA-IPR EPS{% endblock %}
{% block content %}
<a href="{{ url_for('folder', node_id=node.id) }}">← Revenir au dossier {{ node.name }}</a>
<section class="card">
  <h1>Déplacer {{ name }}</h1>
  {% if destinations %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="name" value="{{ name }}">
    <label>Dossier de destination
      <select name="destination" required>
        <option value="">Choisir un dossier</option>
        {% for path, id in destinations %}<option value="{{ id }}">{{ path }}</option>{% endfor %}
      </select>
    </label>
    <button>Déplacer</button>
  </form>
  {% else %}
  <p>Vous n’avez accès à aucun autre dossier en modification.</p>
  {% endif %}
</section>
{% endblock %}
